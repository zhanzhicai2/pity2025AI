[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "layering"
type = "layers"
layers = [
    "routers",
    "services",
    "tasks",
    "core",
    "crud",
    "models",
    "utils",
]
containers = ["app"]
ignore_imports = [
    "app.utils.scheduler -> app.core.executor",
    "app.utils.suite_executor -> app.core.executor",
    "app.core.ai.context_compressor -> app.services.cache_service",
    "app.core.ai.graph.nodes -> app.services.rag_service",
]
